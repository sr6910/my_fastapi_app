<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- ===== ヘッダー ===== -->
<div class="header">
    <h1>ディザ・スタロウにログイン</h1>
    <div>
        <a href="/dashboard">災害情報</a>
        <a href="/prepare">事前準備一覧</a>
        <a href="/register">新規登録</a>
    </div>
</div>

<div class="container">
    <div class="login-wrapper">

        <!-- ===== ログインフォーム ===== -->
        <div class="login-box">
            <h2>ログイン</h2>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="msg">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <form method="POST">
                <label>電話番号</label>
                <input type="text" name="phone" required>

                <label>パスワード</label>
                <input type="password" name="password" required>

                <button type="submit">ログイン</button>
            </form>

        <!-- ===== 登録メリット表示 ===== -->
        <div class="benefit-box">

            <h3>アカウント登録でできること</h3>
            <ul>
                <li>🕒 あなたの住んでいる地域の過去の災害情報を確認</li>
                <li>📱 あなたが危険な災害発生時に通知</li>
                <li>🧰 あなたの災害時に役立つ事前準備リストを確認</li>
                
            </ul>

            <a href="/register" class="register-btn">
                無料でアカウント登録
            </a>

            <p class="note">
                ※ 登録情報は災害情報提供以外の目的では使用しません
            </p>
        </div>

    </div>
</div>

</body>
</html>
